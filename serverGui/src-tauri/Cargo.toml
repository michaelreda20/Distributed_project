[package]
name = "cloud-p2p-dashboard"
version = "0.1.0"
description = "Cloud P2P Server Dashboard"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
anyhow = "1"
rand = "0.8"

[lib]
name = "cloud_p2p_dashboard_lib"
crate-type = ["staticlib", "cdylib", "lib"]
